# KiBot output for MD Report (e.g. README.md)
# https://kibot.readthedocs.io/en/latest/configuration/outputs/report.html

kibot:
  version: 1

outputs:
  - name: @NAME@
    comment: '@COMMENT@'
    type: report
    category: '@CATEGORY@'
    dir: '@DIR@'
    options:
      output: '@OUTPUT_NAME@.md'
      template: @TEMPLATE@
      # The README template uses no collected PCB/SCH prints. With the default (auto) KiBot runs
      # every pcb_print/pdf_sch_print output first, which fails on the DRAFT variant (no drill table yet).
      collect_images: 'no'

...
definitions:
  NAME: md_readme
  COMMENT: Report
  DIR: .
  CATEGORY: /
  OUTPUT_NAME: README
  TEMPLATE: kibot_ressources/template/readme.txt